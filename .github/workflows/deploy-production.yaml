name: Deploy to Production

on:
  push:
    branches: [main]

permissions: {} # Restrict default permissions; override at job level

concurrency:
  group: production-deploy
  queue: max
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: mento-prod
  GCP_REGION: us-central1
  SERVICE_NAME: mento-analytics-api
  SENTRY_ORG: mento-labs
  SENTRY_PROJECT: analytics-api

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full git history for Sentry releases

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Check for Docker changes
        id: docker-changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'package*.json'
              - 'pnpm-lock.yaml'
              - 'src/**'
              - 'tsconfig.json'

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check current main head before deployment
        run: |
          CURRENT_MAIN_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')

          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "Could not resolve current origin/main SHA"
            exit 1
          fi

          if [ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "SKIP_STALE_DEPLOY=true" >> "$GITHUB_ENV"
            echo "Skipping stale production deploy for $GITHUB_SHA; current origin/main is $CURRENT_MAIN_SHA"
          else
            echo "SKIP_STALE_DEPLOY=false" >> "$GITHUB_ENV"
            echo "Production deploy is current for origin/main: $GITHUB_SHA"
          fi

      - name: Set Docker image tag
        if: env.SKIP_STALE_DEPLOY != 'true'
        shell: bash
        run: |
          IMAGE_REPOSITORY="us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}"
          LATEST_IMAGE_TAG="${IMAGE_REPOSITORY}:latest"

          if [ "${{ steps.docker-changes.outputs.docker }}" == "true" ]; then
            SHA_LOWER=$(echo "${GITHUB_SHA}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="${IMAGE_REPOSITORY}:${SHA_LOWER}"
            echo "Docker image will be tagged as: $IMAGE_TAG"
          else
            SERVICE_JSON=$(gcloud run services describe "${SERVICE_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --platform=managed \
              --format=json)

            mapfile -t SERVING_REVISIONS < <(jq -r '
              .status.latestReadyRevisionName as $latestReadyRevision |
              [
                .status.traffic[]?
                | select((.percent // 0) > 0)
                | if ((.revisionName // "") != "") then
                    .revisionName
                  elif (.latestRevision == true and ($latestReadyRevision // "") != "") then
                    $latestReadyRevision
                  else
                    empty
                  end
              ]
              | unique
              | .[]
            ' <<< "$SERVICE_JSON")

            if [ "${#SERVING_REVISIONS[@]}" -ne 1 ]; then
              echo "Metadata-only deploy expected exactly one Cloud Run revision receiving traffic; found ${#SERVING_REVISIONS[@]}."
              echo "Current serving traffic:"
              jq -r '
                .status.latestReadyRevisionName as $latestReadyRevision |
                [.status.traffic[]? | select((.percent // 0) > 0)]
                | if length == 0 then
                    "  (no traffic entries with percent > 0)"
                  else
                    .[]
                    | "  \(
                        .revisionName //
                        (if .latestRevision == true then
                          "latestRevision:" + ($latestReadyRevision // "missing-latestReadyRevisionName")
                        else
                          "unknown-revision"
                        end)
                      ): \(.percent)%"
                  end
              ' <<< "$SERVICE_JSON"
              echo "Refusing to guess which serving image to redeploy."
              exit 1
            fi

            SERVING_REVISION="${SERVING_REVISIONS[0]}"
            IMAGE_TAG=$(gcloud run revisions describe "$SERVING_REVISION" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --platform=managed \
              --format="value(spec.containers[0].image)")

            if [ -z "$IMAGE_TAG" ]; then
              echo "Could not resolve image for serving Cloud Run revision: $SERVING_REVISION"
              exit 1
            fi

            echo "Redeploying image from serving Cloud Run revision ${SERVING_REVISION}: $IMAGE_TAG"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE_TAG=$LATEST_IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: env.SKIP_STALE_DEPLOY != 'true' && steps.docker-changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for GCR
        if: env.SKIP_STALE_DEPLOY != 'true' && steps.docker-changes.outputs.docker == 'true'
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        if: env.SKIP_STALE_DEPLOY != 'true' && steps.docker-changes.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            RELEASE_VERSION=${{ github.sha }}

      - name: Install gcloud beta components
        if: env.SKIP_STALE_DEPLOY != 'true'
        run: |
          gcloud components install beta --quiet

      - name: Recheck current main head before Cloud Build
        if: env.SKIP_STALE_DEPLOY != 'true'
        run: |
          CURRENT_MAIN_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')

          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "Could not resolve current origin/main SHA"
            exit 1
          fi

          if [ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "SKIP_STALE_DEPLOY=true" >> "$GITHUB_ENV"
            echo "Skipping stale production deploy before Cloud Build for $GITHUB_SHA; current origin/main is $CURRENT_MAIN_SHA"
          else
            echo "Production deploy remains current before Cloud Build: $GITHUB_SHA"
          fi

      - name: Trigger Production Deployment
        id: deploy
        if: env.SKIP_STALE_DEPLOY != 'true'
        run: |
          echo "Triggering production deployment for commit: ${{ github.sha }}"
          echo "Using pre-built image: ${{ env.IMAGE_TAG }}"

          BUILD_ID=$(gcloud builds submit \
            --config=cloudbuild.yaml \
            --project="${GCP_PROJECT_ID}" \
            --format="value(id)" \
            --substitutions="_IMAGE_TAG=${IMAGE_TAG},_COMMIT_SHA=${GITHUB_SHA}" \
            --async)

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Production deployment started with ID: $BUILD_ID"

          # Wait for deployment to complete and stream logs
          echo "Streaming deployment logs..."
          gcloud beta builds log "$BUILD_ID" --stream --project="${GCP_PROJECT_ID}"

          # Check deployment status after streaming logs
          echo "Checking deployment status..."
          BUILD_STATUS=$(gcloud builds describe "$BUILD_ID" \
            --project="${GCP_PROJECT_ID}" \
            --format="value(status)")

          echo "Deployment status: $BUILD_STATUS"

          if [ "$BUILD_STATUS" != "SUCCESS" ]; then
            echo "❌ Deployment failed with status: $BUILD_STATUS"
            echo "Deployment logs are available at: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ env.GCP_PROJECT_ID }}"
            exit 1
          else
            echo "✅ Deployment completed successfully"
          fi

      - name: Recheck current main head after Cloud Build
        if: env.SKIP_STALE_DEPLOY != 'true'
        run: |
          CURRENT_MAIN_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')

          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "Could not resolve current origin/main SHA"
            exit 1
          fi

          if [ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "SKIP_DEPLOY_FINALIZATION=true" >> "$GITHUB_ENV"
            echo "Skipping post-deploy tag/status finalization for stale commit $GITHUB_SHA; current origin/main is $CURRENT_MAIN_SHA"
          else
            echo "SKIP_DEPLOY_FINALIZATION=false" >> "$GITHUB_ENV"
            echo "Production deploy remains current after Cloud Build: $GITHUB_SHA"
          fi

      - name: Advance latest Docker tag
        if: env.SKIP_STALE_DEPLOY != 'true' && env.SKIP_DEPLOY_FINALIZATION != 'true' && steps.docker-changes.outputs.docker == 'true'
        run: |
          echo "Advancing ${{ env.LATEST_IMAGE_TAG }} to successfully deployed image: ${{ env.IMAGE_TAG }}"
          gcloud artifacts docker tags add \
            "${{ env.IMAGE_TAG }}" \
            "${{ env.LATEST_IMAGE_TAG }}" \
            --quiet

      - name: Set service URL
        if: env.SKIP_STALE_DEPLOY != 'true' && env.SKIP_DEPLOY_FINALIZATION != 'true'
        run: |
          echo "SERVICE_URL=https://${SERVICE_NAME}-${GCP_PROJECT_ID}.${GCP_REGION}.run.app" >> "$GITHUB_ENV"

      - name: Create Sentry release
        if: env.SKIP_STALE_DEPLOY != 'true' && env.SKIP_DEPLOY_FINALIZATION != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "Creating Sentry release for version: ${{ github.sha }}"

          # Debug: Check if SENTRY_AUTH_TOKEN is set (without exposing the value)
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "❌ ERROR: SENTRY_AUTH_TOKEN is not set!"
            echo "Please add SENTRY_AUTH_TOKEN to your repository secrets."
            exit 1
          else
            echo "✅ SENTRY_AUTH_TOKEN is set (length: ${#SENTRY_AUTH_TOKEN})"
          fi

          # Create new release
          npx @sentry/cli releases new ${{ github.sha }} \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }}

          # Inject Debug IDs into source files
          npx @sentry/cli sourcemaps inject ./dist \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }}

          # Upload source maps
          npx @sentry/cli sourcemaps upload ./dist \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }} \
            --release ${{ github.sha }} \
            --validate

          # Associate commits with release
          npx @sentry/cli releases set-commits ${{ github.sha }} --auto \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }}

          # Finalize the release
          npx @sentry/cli releases finalize ${{ github.sha }} \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }}

          # Mark as deployed to production
          npx @sentry/cli releases deploys ${{ github.sha }} new \
            --org ${{ env.SENTRY_ORG }} \
            --project ${{ env.SENTRY_PROJECT }} \
            --env production \
            --name "Production Deployment" \
            --url "$SERVICE_URL"

          find ./dist -name "*.map" -type f -delete
          echo "Source maps cleaned up"

          echo "✅ Sentry release completed successfully!"

      - name: Update deployment status
        if: env.SKIP_STALE_DEPLOY != 'true' && env.SKIP_DEPLOY_FINALIZATION != 'true'
        uses: actions/github-script@v7
        env:
          SERVICE_URL: ${{ env.SERVICE_URL }}
        with:
          script: |
            const serviceUrl = process.env.SERVICE_URL;

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              task: 'deploy:production',
              auto_merge: false,
              required_contexts: [],
              environment: 'production',
              description: 'Production deployment',
              production_environment: true
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              target_url: serviceUrl,
              environment_url: serviceUrl,
              description: 'Production deployment completed successfully'
            });
